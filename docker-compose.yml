# Salexa SaaS — full stack, one command: docker compose up --build
#
# Topology mirrors production:
#   postgres   <- control DB + one DB per tenant (created by the provisioner)
#   pgbouncer  <- transaction pooling; ALL app query traffic goes through it
#   backend    <- Django/DRF (stateless; scale with --scale backend=N)
#   frontend   <- Next.js standalone
#
# Every service is stateless except postgres -> straight path to Kubernetes
# (each service becomes a Deployment; postgres becomes a managed DB/StatefulSet).

name: salexa

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-salexa}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-salexa-dev-password}
      POSTGRES_DB: salexa_control
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-salexa} -d salexa_control"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${PG_USER:-salexa}
      DB_PASSWORD: ${PG_PASSWORD:-salexa-dev-password}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment: &backend-env
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-change-me}
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      # Control DB via the pooler
      POSTGRES_DB: salexa_control
      POSTGRES_USER: ${PG_USER:-salexa}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-salexa-dev-password}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      # Tenant DBs: query traffic via pooler, CREATE DATABASE direct
      TENANT_DB_ENGINE: postgres
      TENANT_PG_HOST: pgbouncer
      TENANT_PG_PORT: "5432"
      TENANT_PG_USER: ${PG_USER:-salexa}
      TENANT_PG_PASSWORD: ${PG_PASSWORD:-salexa-dev-password}
      TENANT_PG_MAINTENANCE_HOST: postgres
      TENANT_PG_MAINTENANCE_PORT: "5432"
      TENANT_PG_MAINTENANCE_DB: salexa_control
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      PORTAL_BASE_URL: http://localhost:3000
      WEB_CONCURRENCY: "4"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  # Periodic jobs. Without this the event outbox records failed auto-posts but
  # never retries them, so a lost ledger entry or stock movement stays lost.
  # Same image as the backend; overrides the entrypoint (which runs gunicorn)
  # and waits for the backend so control-plane migrations land first.
  scheduler:
    build: ./backend
    entrypoint: ["python", "manage.py", "run_scheduler"]
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000/api}
    environment:
      # Server-side (SSR) requests stay on the Docker network
      API_BASE_INTERNAL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
