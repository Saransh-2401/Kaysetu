# KaySetu SaaS — full local stack. Bring it all up with `.\run.ps1`.
#
# Topology mirrors production for the data plane:
#   postgres   <- control DB + one DB per tenant (created by the provisioner)
#   pgbouncer  <- transaction pooling; ALL app query traffic goes through it
#   backend    <- Django/DRF (stateless; scale with --scale backend=N)
#   scheduler  <- periodic jobs (outbox retry, maintenance)
#   frontend   <- SuperAdmin ops console + signup  (http://localhost:3000)
#   portal     <- tenant application, per-module screens (http://localhost:3001)
#   landing    <- public marketing site            (http://localhost:3002)
#
# The two Next.js apps run in DEV mode here on purpose: for a local test rig
# that is far more reliable than a production standalone build (no build-time
# lint/type gate to trip over) and needs no rebuild to see a code change. The
# data-plane services still mirror production, so the K8s path is unchanged.
# Every service is stateless except postgres.

name: kaysetu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-kaysetu}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kaysetu-dev-password}
      POSTGRES_DB: kaysetu_control
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-kaysetu} -d kaysetu_control"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_USER: ${PG_USER:-kaysetu}
      DB_PASSWORD: ${PG_PASSWORD:-kaysetu-dev-password}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "20"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment: &backend-env
      # A concrete local key: DEBUG is off (production-shaped), and settings.py
      # refuses to boot when DEBUG=0 with a known-insecure default. Override with
      # your own SECRET_KEY env for anything real.
      SECRET_KEY: ${SECRET_KEY:-kaysetu-local-dev-7f3c9a21b8e4d6f0a2c5}
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
      # Control DB via the pooler
      POSTGRES_DB: kaysetu_control
      POSTGRES_USER: ${PG_USER:-kaysetu}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kaysetu-dev-password}
      POSTGRES_HOST: pgbouncer
      POSTGRES_PORT: "5432"
      # Tenant DBs: query traffic via pooler, CREATE DATABASE direct
      TENANT_DB_ENGINE: postgres
      TENANT_PG_HOST: pgbouncer
      TENANT_PG_PORT: "5432"
      TENANT_PG_USER: ${PG_USER:-kaysetu}
      TENANT_PG_PASSWORD: ${PG_PASSWORD:-kaysetu-dev-password}
      TENANT_PG_MAINTENANCE_HOST: postgres
      TENANT_PG_MAINTENANCE_PORT: "5432"
      TENANT_PG_MAINTENANCE_DB: kaysetu_control
      # Ops console on :3000, tenant portal on :3001 — both must be allowed.
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      PORTAL_BASE_URL: http://localhost:3001
      WEB_CONCURRENCY: "4"
      # Media/image service. Unset locally on purpose: without a key the API
      # refuses uploads loudly (503) instead of pretending they succeeded.
      IMAGE_SERVICE_URL: "${IMAGE_SERVICE_URL:-https://img.kaysetu.in}"
      IMAGE_SERVICE_API_KEY: "${IMAGE_SERVICE_API_KEY:-}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      # The runner waits on this before seeding the SuperAdmin + demo tenants.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 25s

  # Periodic jobs. Without this the event outbox records failed auto-posts but
  # never retries them, so a lost ledger entry or stock movement stays lost.
  # Same image as the backend; overrides the entrypoint (which runs gunicorn)
  # and waits for the backend so control-plane migrations land first.
  scheduler:
    build: ./backend
    entrypoint: ["python", "manage.py", "run_scheduler"]
    environment: *backend-env
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

  # SuperAdmin ops console + signup. Dev server; source is mounted, deps live in
  # a named volume (Linux-native, so host node_modules never leaks in).
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3000 -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
      NEXT_PUBLIC_PORTAL_URL: http://localhost:3001
      API_BASE_INTERNAL: http://backend:8000/api
      WATCHPACK_POLLING: "true"     # file-change detection across the mount
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # Tenant application — the per-module screens a customer's staff log into.
  portal:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3001 -H 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"
    volumes:
      - ./portal:/app
      - portal_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy

  # Public marketing site (kaysetu.in in production). Static content, so it has
  # no backend dependency — a database problem must never take the website down.
  landing:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -p 3002 -H 0.0.0.0"
    environment:
      # Lead capture posts here from the browser.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
      WATCHPACK_POLLING: "true"
    volumes:
      - ./KaySetu-Landing-Page-main:/app
      - landing_node_modules:/app/node_modules
    ports:
      - "3002:3002"

volumes:
  pgdata:
  frontend_node_modules:
  portal_node_modules:
  landing_node_modules:
