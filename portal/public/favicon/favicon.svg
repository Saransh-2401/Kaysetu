<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="KaySetu">
  <title>KaySetu</title>
  <!-- "Setu" = bridge: two navy arches carried on a teal span. Colours sampled
       from the master mark (public/logo.png on the marketing site). -->
  <rect width="512" height="512" fill="#ffffff"/>
  <g fill="none" stroke="#10234B" stroke-width="30">
    <path d="M78 330 A79 79 0 0 1 236 330"/>
    <path d="M276 330 A79 79 0 0 1 434 330"/>
  </g>
  <!-- Teal keystone where the two arches meet -->
  <path d="M254 262 q26 32 26 68 h-28 q0-36 2-68 z" fill="#009688"/>
  <!-- Deck -->
  <line x1="62" y1="330" x2="450" y2="330" stroke="#1FA397" stroke-width="12" stroke-linecap="round"/>
  <circle cx="62" cy="330" r="9" fill="#1FA397"/>
  <circle cx="450" cy="330" r="9" fill="#1FA397"/>
</svg>
